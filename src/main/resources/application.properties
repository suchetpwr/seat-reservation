spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/seat_reservation}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:seat_app}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:seat_password}
spring.application.name=seat-reservation
spring.application.name=seat-reservation

spring.datasource.url=jdbc:postgresql://localhost:5433/seat_reservation
spring.datasource.username=seat_app
spring.datasource.password=seat_password
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true

management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db

app.admin-token=admin-secret

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{correlationId}] %logger{36} - %msg%n
